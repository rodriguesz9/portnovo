        <h1>Robert Rodrigues — projetos e aprendizado</h1>
        <p>Programação é um hobby: um espaço para experimentar ideias, construir interfaces e aprender em projetos pessoais e em equipe. Quero trabalhar em outra área e seguir explorando código por curiosidade.</p>
        <h2>Projetos selecionados</h2>
        <ul>
          <li>Salão Seninha: proposta de site para um negócio local, em revisão. Astro, TypeScript e CSS. Não há contratação ou entrega final confirmada.</li>
          <li>Finanças Já: projeto pessoal de organização financeira. Repositório privado; a demonstração não comprova dados financeiros reais.</li>
          <li><a href="https://github.com/KaykyFideliss/TrimmCompany-">Trimm Company / Fivonn</a>: trabalho em equipe para barbearias. Não afirma operação comercial.</li>
          <li><a href="https://github.com/rodriguesz9/MyDay">MyDay</a>: projeto pessoal de organização de tarefas em JavaScript.</li>
        </ul>
        <h2>Formação e ferramentas</h2>
        <p>Técnico em TI, Funec Riacho, em formação. Tecnologias que exploro, sem declaração de especialização:</p>
        <p>Interfaces: HTML, CSS, JavaScript, TypeScript, React, Vite, Tailwind e Astro. Backend: PHP, Python, FastAPI e Laravel. Dados: SQLite e PostgreSQL. Ambiente: Docker, Linux, Git, GitHub e VS Code.</p>
        <p>Cursos e estudos: Matheus Battisti (Linux e React), Curso em Vídeo (JavaScript, HTML, CSS e Python), CFBCursos (JavaScript), CampCode (FastAPI) e Danki Code (Hacker Ético).</p>
        <h2>Conhecer o código</h2>
        <p><a href="https://github.com/rodriguesz9">Explorar o GitHub de Robert Rodrigues</a>.</p>
        <p>Esta é a versão informativa sem JavaScript. A galeria, os efeitos, o robô decorativo e o gerador de resumo local precisam de JavaScript. Nenhuma mensagem é enviada automaticamente.</p>
